<!-- index.html -->
<!-- Página inicial: menu com os jogos disponíveis -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogos</title>
  <style>
    :root {
      --bg: #0a0e14;
      --ink: #e8f0ff;
      --accent: #4de2c2;
      --accent2: #ff5d73;
      --accent3: #ffd166;
      --muted: #5a6b82;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(1200px 600px at 50% -20%, #131c2b 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.02em;
      padding: 20px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 800;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent3) 50%, var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .grade {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 720px;
    }

    a.jogo {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
      padding: 22px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 20px 40px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.jogo:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.12) inset, 0 24px 50px rgba(0,0,0,0.5);
    }

    a.jogo .titulo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    a.jogo.pong .titulo { color: var(--accent); }
    a.jogo.bomberman .titulo { color: var(--accent3); }

    a.jogo .desc { font-size: 13px; color: var(--muted); line-height: 1.6; }

    footer { color: var(--muted); font-size: 12px; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <h1>Jogos</h1>

  <div class="grade">
    <a class="jogo pong" href="pong.html">
      <span class="titulo">Pong</span>
      <span class="desc">Clássico 1x1. Jogue sozinho contra a CPU ou online com um amigo via WebRTC.</span>
    </a>
    <a class="jogo bomberman" href="bomberman.html">
      <span class="titulo">Bomberman</span>
      <span class="desc">Explosões e labirinto destrutível para 2 ou 3 jogadores online.</span>
    </a>
  </div>

  <footer>feito com canvas 2d + PeerJS (WebRTC)</footer>
</body>
</html>
